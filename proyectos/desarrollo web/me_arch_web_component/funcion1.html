<html lang="en">
  <head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Adivina la pelicula</title>
	<link rel="stylesheet" href="style.css" />
  </head>

  <body>
    
    <me-arch>
        <menu href="https://www.youtube.com/@UniversidadRafaelUrdanetaURU" text="YouTube"></menu>
        <menu href="https://twitter.com/notiuru?lang=es" text="Twitter"></menu>
        <menu href="prueba/index.html" text="Volver"></menu>
    </me-arch>

	<div class="wrapper">
	  <div class="num-of-tries-left"><span>Tries Left:</span> 05</div>
	  <div class="container"></div>
	  <div id="letter-container" class="hide"></div>
	  <div id="userInputSection"></div>
	
   
	<div class="controls-container">
	  <p id="result"></p>
	  <a id="start">Start</a>
	</div>
	<script>
	  const moviesObject = {
  '👸👹🌹': 'Beauty And The Beast',
  '🧙👓⚡': 'Harry Potter',
  '🦇🃏 ': 'Joker',
  '👩‍❤️‍👨🚢🥶': 'Titanic',
  '👻👻🔫': 'Ghostbusters',
  '🐜👨 ': 'Antman',
  '🐀👨‍🍳 ': 'Ratatouille',
  '🖊️📓👩‍❤️‍👨': 'The notebook',
  '😈👗👠': 'Devil Wears Prada',
  '📱🍎 ': 'Jobs',
  '🎉🍺🎊❎': 'This Is the End',
  '🔍🐟 ': 'Finding Nemo',
  '👸📔 ': 'Princess Diaries',
  '🐔🏃 ': 'Chicken Run',
};
const container = document.querySelector('.container');
const controls = document.querySelector('.controls-container');
const startButton = document.getElementById('start');
const letterContainer = document.getElementById('letter-container');
const userInputSection = document.getElementById('userInputSection');
const resultText = document.getElementById('result');
const hints = Object.keys(moviesObject);
let randomHint = '',
  randomWord = '';
let winCount = 0,
  lossCount = 5;

const generateRandomValue = (array) => Math.floor(Math.random() * array.length);

const blocker = () => {
  let letterButtons = document.querySelectorAll('.letters');


  letterButtons.forEach((button) => {
    button.disabled = true;
  });
  stopGame();
};


startButton.addEventListener('click', () => {

  controls.classList.add('hide');
  init();
});

const stopGame = () => {
  controls.classList.remove('hide');
};

const generateWord = () => {

  letterContainer.classList.remove('hide');
  userInputSection.innerText = '';
  randomHint = hints[generateRandomValue(hints)];
  randomWord = moviesObject[randomHint];
  container.innerHTML = ` <div id="movieHint">${randomHint}</div>`;

  let displayItem = '';
  randomWord.split('').forEach((value) => {
    if (value == ' ') {
      winCount += 1;
      displayItem += '<span class="dashes">&nbsp;</span>';
    } else {
      displayItem += '<span class="dashes">_ </span>';
    }
  });

  userInputSection.innerHTML = displayItem;
};

const init = () => {
  winCount = 0;
  lossCount = 5;
  randomHint = null;
  randomWord = '';
  userInputSection.innerHTML = '';
  letterContainer.classList.add('hide');
  letterContainer.innerHTML = '';
  generateWord();

  for (let i = 65; i < 91; i++) {
    let button = document.createElement('button');

    button.innerText = String.fromCharCode(i);

    button.addEventListener('click', () => {
      let charArray = randomWord.toUpperCase().split('');
      let dashes = document.getElementsByClassName('dashes');

      if (charArray.includes(button.innerText)) {
        charArray.forEach((char, index) => {
     
          if (char === button.innerText) {
            button.classList.add('used');

            dashes[index].innerText = char;
          
            winCount += 1;

            if (winCount == charArray.length) {
              resultText.innerHTML = 'You Won';
      
              blocker();
            }
          }
        });
      } else {
     
        lossCount -= 1;
        button.classList.add('used');
        document.querySelector(
          '.num-of-tries-left'
        ).innerHTML = `<span>Tries Left:</span> 0${lossCount}`;
        if (lossCount == 0) {
          resultText.innerHTML = 'Game Over';
          blocker();
        }
      }

      button.disabled = true;
    });
    letterContainer.appendChild(button);
  }
};
window.onload = () => {
  init();
};

	</script>

    <script src="./prueba/menu-hamburguesa.js">
    </script>
  </body>
</html>
